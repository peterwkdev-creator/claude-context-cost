# Dependabot only for the workflows' actions. It turns on by itself with this
# file on main, with no change in Settings. One pull request a month with all
# the actions together; it is merged only with green CI and the owner's yes.
# Without it, an action on a retired runtime shows up only when someone
# reads the warning in a run.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
