# Tests on every push and pull request, on every Python the pyproject accepts
# (requires-python), from a clean checkout with nothing installed, as the
# README says. A Windows job checks the command line output outside UTF-8
# (cp1252).
name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    # the suite takes seconds; without a limit a stuck process holds the job for 6 h
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
