# Tests on every push and pull request, on every Python the pyproject accepts
# (requires-python), from a clean checkout with nothing installed, as the
# README says. A Windows job checks the command line output outside UTF-8
# (cp1252). The "pacote" job builds the wheel and runs what pip installs, as
# pypi.yml does before publishing.
name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    # the suite takes seconds; without a limit a stuck process holds the job for 6 h
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v

  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # "3.x", not a number: conferir-publico looks for the floor and the
          # showcase's Python in this file, and a number here would hide a gap
          # in the matrix
          python-version: "3.x"
      - run: bash .github/conferir-instalado.sh
      # PyPI refuses a description that does not render; here the warning
      # comes on push, not on the Release (the action checks again before
      # publishing)
      - run: |
          python -m pip install --quiet "twine==7.0.0"
          python -m twine check --strict dist/*
