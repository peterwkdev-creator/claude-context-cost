# Showcase on GitHub Pages: the library running in the browser (Pyodide).
# Pages source: Settings -> Pages -> Source: "GitHub Actions" (once).
# Action versions checked on 2026-10-10 (latest release of each). Tests and
# build run read-only; Pages write and OIDC stay in the job that deploys, as in
# GitHub's own Pages starter workflow.
name: Vitrine
on:
  push:
    branches: [main]
    paths: ["claude_context_cost/**", "vitrine/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The same Python version that Pyodide 314 runs in the browser.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Tests (the page ships only if the library passes)
        run: python -m unittest -q
      - name: Build
        run: python vitrine/montar.py --saida _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
