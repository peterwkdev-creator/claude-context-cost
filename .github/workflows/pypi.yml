# PyPI (https://pypi.org/project/claude-context-cost/). On every published
# Release: tests, builds the sdist and the wheel, runs what pip installs and
# publishes through trusted publishing (OIDC), with no stored token. On PyPI
# the project accepts only this file, from this repository, in the "pypi"
# environment. Every action pinned to the commit of the version in the
# comment, read from the GitHub API on 2026-10-11 (a tag can move; Dependabot
# updates the pair).
#
# Tests and the build run in a read-only job; the publishing job gets only
# the built dist/ and the OIDC token. A pre-release does not publish. On
# GitHub, the "pypi" environment accepts only v* tags and asks the owner to
# approve.
name: PyPI
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  montar:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Tests
        run: python -m unittest -q
      - name: The tag is the library's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(python -c 'import claude_context_cost as p; print(p.__version__)')"
      - name: Build and run the installed package
        run: bash .github/conferir-instalado.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/claude-context-cost/
    permissions:
      id-token: write  # trusted publishing on PyPI
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
